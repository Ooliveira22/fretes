<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>COMISSIONADO — Controle de Fretes e Comissões</title>
    <meta name="description" content="Controle offline de fretes e comissões: cadastre, edite e acompanhe valores a receber e recebidos." />
    <meta name="theme-color" content="#1B5E20" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
  </head>
  <body>
    <!-- SPLASH -->
    <div id="splash" class="splash">
      <img class="splash-logo" src="assets/logo/logo.png" alt="Logo COMISSIONADO" width="128" height="128" />
      <h1 class="splash-title">COMISSIONADO</h1>
      <p class="splash-sub">Controle de Fretes e Comissões</p>
      <span class="splash-version">Versão 0.1</span>
    </div>

    <!-- APP -->
    <div id="app" class="app hidden">
      <header class="appbar">
        <img src="assets/logo/logo.png" alt="" class="appbar-logo" width="32" height="32" />
        <h1>COMISSIONADO</h1>
      </header>

      <main class="content">
        <section class="cards">
          <article class="card card-pending">
            <span class="card-label"><i class="mi">schedule</i> A RECEBER</span>
            <strong class="card-value" id="valorPendente">R$ 0,00</strong>
            <span class="card-meta"><span id="qtdPendente">0</span> fretes pendentes</span>
          </article>
          <article class="card card-paid">
            <span class="card-label"><i class="mi">check_circle</i> RECEBIDO</span>
            <strong class="card-value" id="valorRecebido">R$ 0,00</strong>
            <span class="card-meta"><span id="qtdRecebido">0</span> fretes recebidos</span>
          </article>
        </section>

        <button class="btn btn-primary btn-block" id="btnNovo">
          <i class="mi">add</i> NOVO FRETE
        </button>

        <button class="btn btn-secondary btn-block hidden" id="btnInstall">
          <i class="mi">download</i> Instalar no celular
        </button>

        <div class="searchbar">
          <i class="mi">search</i>
          <input id="busca" type="search" placeholder="Pesquisar origem, destino, cliente..." aria-label="Pesquisar fretes" />
          <button id="btnOrdem" class="icon-btn" title="Ordenar por data"><i class="mi">swap_vert</i></button>
        </div>

        <ul class="list" id="lista"></ul>
        <p class="empty hidden" id="vazio">Nenhum frete encontrado.</p>
      </main>
    </div>

    <!-- FORM SHEET -->
    <div class="sheet-backdrop hidden" id="backdrop"></div>
    <section class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <h2 id="sheetTitle">Novo Frete</h2>
      <form id="form" class="form" novalidate>
        <input type="hidden" id="id" />
        <label>Data<input type="date" id="data" required /></label>
        <label>Origem<input type="text" id="origem" placeholder="Cidade de origem" required /></label>
        <label>Destino<input type="text" id="destino" placeholder="Cidade de destino" required /></label>
        <label>Cliente<input type="text" id="cliente" placeholder="Nome do cliente" /></label>
        <div class="row">
          <label>Valor do Frete<input type="number" id="valorFrete" step="0.01" min="0" placeholder="0,00" /></label>
          <label>Valor da Comissão<input type="number" id="valorComissao" step="0.01" min="0" placeholder="0,00" /></label>
        </div>
        <div class="segmented" role="radiogroup" aria-label="Status">
          <button type="button" class="seg active" data-status="A Receber">A Receber</button>
          <button type="button" class="seg" data-status="Recebido">Recebido</button>
        </div>
        <label>Observações<textarea id="observacoes" rows="3" placeholder="Anotações..."></textarea></label>
        <div class="actions">
          <button type="submit" class="btn btn-primary"><i class="mi">save</i> Salvar</button>
          <button type="button" class="btn btn-ghost" id="btnCancelar">Cancelar</button>
          <button type="button" class="btn btn-danger hidden" id="btnExcluir"><i class="mi">delete</i> Excluir</button>
        </div>
      </form>
    </section>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
