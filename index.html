<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>COMISSIONADO — Controle de Fretes e Comissões</title>
    <meta name="description" content="Controle offline de fretes e comissões: cadastre, edite e acompanhe valores a receber e recebidos." />
    <meta name="theme-color" content="#1B5E20" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icons/icon-rs.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/icon-rs.svg" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
  </head>
  <body>
    <!-- SPLASH -->
    <div id="splash" class="splash">
      <img class="splash-logo" src="assets/logo/logo-rs.svg" alt="Logo COMISSIONADO" width="128" height="128" />
      <h1 class="splash-title">COMISSIONADO</h1>
      <p class="splash-sub">Controle de Fretes e Comissões</p>
      <span class="splash-version">Versão 0.1.18</span>
    </div>

    <!-- LOGIN -->
    <section id="login" class="login hidden">
      <img class="splash-logo" src="assets/logo/logo-rs.svg" alt="Logo COMISSIONADO" width="96" height="96" />
      <h1>COMISSIONADO</h1>
      <p>Acesso privado aos seus fretes</p>
      <form id="loginForm" class="login-form" novalidate>
        <input id="loginEmail" type="email" placeholder="E-mail" autocomplete="email" required />
        <input id="loginPassword" type="password" placeholder="Senha" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <button type="button" class="btn btn-ghost btn-block" id="btnReenviarVerificacao">Reenviar confirmação do e-mail</button>
        <button type="button" class="btn btn-ghost btn-block" id="btnFecharLogin">Cancelar</button>
      </form>
    </section>

    <!-- APP -->
    <div id="app" class="app hidden">
      <header class="appbar">
        <img src="assets/logo/logo-rs.svg" alt="" class="appbar-logo" width="32" height="32" />
        <h1>COMISSIONADO</h1>
        <button id="btnAdmin" class="btn btn-login" title="Acesso do administrador"><i class="mi">lock</i> ENTRAR</button>
        <button id="btnSair" class="btn btn-login hidden" title="Sair"><i class="mi">logout</i> SAIR</button>
      </header>

      <main class="content">
        <section class="month-summary" aria-label="Resumo mensal">
          <strong id="mesAtual" class="month-label"></strong>
          <button id="btnMesAnterior" class="month-arrow" type="button" title="Mês anterior" aria-label="Mês anterior">
            <i class="mi">chevron_left</i>
          </button>
          <div class="cards">
            <article class="card card-pending">
              <span class="card-label"><i class="mi">schedule</i> A RECEBER</span>
              <strong class="card-value" id="valorPendente">R$ 0,00</strong>
              <span class="card-meta"><span id="qtdPendente">0</span> fretes pendentes</span>
            </article>
            <article class="card card-paid">
              <span class="card-label"><i class="mi">check_circle</i> RECEBIDO</span>
              <strong class="card-value" id="valorRecebido">R$ 0,00</strong>
              <span class="card-meta"><span id="qtdRecebido">0</span> fretes recebidos</span>
            </article>
          </div>
          <button id="btnProximoMes" class="month-arrow" type="button" title="Próximo mês" aria-label="Próximo mês">
            <i class="mi">chevron_right</i>
          </button>
        </section>

        <button class="btn btn-primary btn-block admin-only" id="btnNovo">
          <i class="mi">add</i> NOVO FRETE
        </button>

        <button class="btn btn-secondary btn-block hidden" id="btnInstall">
          <i class="mi">download</i> Instalar no celular
        </button>

        <div class="searchbar">
          <i class="mi">search</i>
          <input id="busca" type="search" placeholder="Pesquisar origem, destino, cliente..." aria-label="Pesquisar fretes" />
          <button id="btnOrdem" class="icon-btn" title="Ordenar por data"><i class="mi">swap_vert</i></button>
        </div>

        <ul class="list" id="lista"></ul>
        <p class="empty hidden" id="vazio">Nenhum frete encontrado.</p>
        <footer class="app-credit" aria-label="Créditos">OOgordiN</footer>
      </main>
    </div>

    <!-- FORM SHEET -->
    <div class="sheet-backdrop hidden" id="backdrop"></div>
    <section class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <h2 id="sheetTitle">Novo Frete</h2>
      <form id="form" class="form" novalidate>
        <input type="hidden" id="id" />
        <label>Data<input type="date" id="data" required /></label>
        <label>Origem<input type="text" id="origem" placeholder="Cidade de origem" required /></label>
        <label>Destino<input type="text" id="destino" placeholder="Cidade de destino" required /></label>
        <label>Cliente<input type="text" id="cliente" placeholder="Nome do cliente" /></label>
        <div class="row">
          <label>Valor do Frete<input type="number" id="valorFrete" step="0.01" min="0" placeholder="0,00" /></label>
          <label>Valor da Comissão<input type="number" id="valorComissao" step="0.01" min="0" placeholder="0,00" /></label>
        </div>
        <div class="segmented" role="radiogroup" aria-label="Status">
          <button type="button" class="seg active" data-status="A Receber">A Receber</button>
          <button type="button" class="seg" data-status="Recebido">Recebido</button>
          <button type="button" class="seg hidden" id="parcialBtn" data-status="Parcial">Recebimento parcial</button>
        </div>
        <label id="parcialGroup" class="hidden">Valor recebido<input type="number" id="valorRecebidoParcial" step="0.01" min="0" placeholder="0,00" /></label>
        <label>Observações<textarea id="observacoes" rows="3" placeholder="Anotações..."></textarea></label>
        <div class="actions">
          <button type="submit" class="btn btn-primary admin-only"><i class="mi">save</i> Salvar</button>
          <button type="button" class="btn btn-ghost" id="btnCancelar">Cancelar</button>
          <button type="button" class="btn btn-danger hidden admin-only" id="btnExcluir"><i class="mi">delete</i> Excluir</button>
        </div>
      </form>
    </section>

    <div id="toast" class="toast"></div>
    <script src="app.js?v=12"></script>
  </body>
</html>
