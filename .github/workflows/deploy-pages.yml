name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create local-config.js from secret
        run: |
          if [ -z "${{ secrets.OWNER_EMAIL }}" ]; then
            echo "window.localConfig = { OWNER_EMAIL: null };" > local-config.js
          else
            printf '%s\n' "window.localConfig = { OWNER_EMAIL: \"${{ secrets.OWNER_EMAIL }}\" };" > local-config.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
